services:
  app:
    image: ftp2s3-app:latest
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_DATABASE_URL: sqlite:////app/data/app.db
      POSTGRES_HOST: postgres
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "${APP_HOST_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_data:/app/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ftp2s3}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  app_data:
    name: ftp2s3-app-data
  postgres_data:
    name: ftp2s3-postgres-data
