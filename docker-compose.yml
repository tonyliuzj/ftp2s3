services:
  app:
    image: ftp2s3-app:latest
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_DATABASE_URL: sqlite:////app/data/app.db
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "${APP_HOST_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_data:/app/data

volumes:
  app_data:
    name: ftp2s3-app-data
